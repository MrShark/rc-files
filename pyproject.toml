[tool.poetry]
name = "rc-files"
version = "0.0.0"
description = "Personal rc files and scripts"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"


[dependency-groups]
dev = [
    "ruff",       # Linting
    "pytest",     # Test runner
    "pytest-cov", # Coverage for pytest, including subprocess support
    "prek",       # Pre-commit hooks manager
]


[tool.pytest.ini_options]
addopts = "--cov=bin --cov-fail-under=75 --cov-report=term-missing"

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # prefer D211 (no blank line before class docstring)
    "D212",    # prefer D213 (summary on second line)
    "T201",    # print() is intentional in CLI scripts
    "PLR2004", # magic values are fine in personal scripts
    "SIM108",  # ternary is not always clearer
    "D103",    # public function docstrings are optional
    "E501",    # no line-length limit
    "COM812",  # trailing comma not required
    "ANN",     # type annotations are optional
    "CPY001",  # Do not require copyright notices in files
    "ICN001",  # Don't require aliases in imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts are OK in pytest tests
]
